<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1080" height="540" fill="#161616"/>
  <rect x="0" y="0" width="1080" height="6" fill="#C9A86A"/>

  <text x="60" y="64" fill="#EDE9E0" font-size="32" font-weight="700">Prompt Structure: Wrong vs Right</text>
  <text x="60" y="96" fill="#9A958C" font-size="19">Same model. Different prompt wiring. Everything downstream changes.</text>

  <!-- LEFT: WRONG -->
  <rect x="60" y="130" width="460" height="40" rx="8" fill="#3A1F1D"/>
  <text x="290" y="157" fill="#E08B82" font-size="19" font-weight="700" text-anchor="middle">WITHOUT ALIGNMENT</text>

  <rect x="60" y="184" width="460" height="150" rx="10" fill="#1F1F1F" stroke="#5A2E2A"/>
  <text x="80" y="216" fill="#C9B8B6" font-size="15" font-family="monospace">A woman in a red coat in a cafe.</text>
  <text x="80" y="242" fill="#C9B8B6" font-size="15" font-family="monospace">She walks, turns, laughs, drinks,</text>
  <text x="80" y="268" fill="#C9B8B6" font-size="15" font-family="monospace">looks at phone, opens door,</text>
  <text x="80" y="294" fill="#C9B8B6" font-size="15" font-family="monospace">smiles, leaves. [Zoom in]</text>
  <text x="80" y="320" fill="#7A6E6C" font-size="14">one merged block · no soundscape · 8 actions · bracket tag</text>

  <rect x="60" y="350" width="140" height="40" rx="20" fill="#2A1715"/>
  <text x="130" y="376" fill="#E08B82" font-size="15" text-anchor="middle">audio collapses</text>
  <rect x="212" y="350" width="130" height="40" rx="20" fill="#2A1715"/>
  <text x="277" y="376" fill="#E08B82" font-size="15" text-anchor="middle">face swap</text>
  <rect x="354" y="350" width="166" height="40" rx="20" fill="#2A1715"/>
  <text x="437" y="376" fill="#E08B82" font-size="15" text-anchor="middle">fast-forward mush</text>

  <!-- RIGHT: RIGHT -->
  <rect x="560" y="130" width="460" height="40" rx="8" fill="#1D3326"/>
  <text x="790" y="157" fill="#9BD0A8" font-size="19" font-weight="700" text-anchor="middle">WITH 3 FIELDS + ALIGNMENT</text>

  <rect x="560" y="184" width="460" height="34" rx="8" fill="#211C12" stroke="#4A3D22"/>
  <text x="580" y="207" fill="#E6D2A8" font-size="13" font-family="monospace">&lt;Picture 1&gt; (from [Shot 1]) is fully referenced.</text>
  <rect x="560" y="226" width="460" height="34" rx="8" fill="#1F1F1F" stroke="#33312C"/>
  <text x="580" y="249" fill="#C9D6C9" font-size="13" font-family="monospace">She sips, sets down, glances at glass.</text>
  <rect x="560" y="268" width="460" height="34" rx="8" fill="#1F1F1F" stroke="#33312C"/>
  <text x="580" y="291" fill="#C9D6C9" font-size="13" font-family="monospace">Espresso hiss, cup clink, rainfall.</text>
  <rect x="560" y="310" width="460" height="34" rx="8" fill="#1F1F1F" stroke="#33312C"/>
  <text x="580" y="333" fill="#C9D6C9" font-size="13" font-family="monospace">Nylon guitar, mid-tempo lo-fi.</text>

  <rect x="560" y="350" width="140" height="40" rx="20" fill="#16291E"/>
  <text x="630" y="376" fill="#9BD0A8" font-size="15" text-anchor="middle">frame locked</text>
  <rect x="712" y="350" width="130" height="40" rx="20" fill="#16291E"/>
  <text x="777" y="376" fill="#9BD0A8" font-size="15" text-anchor="middle">rich audio</text>
  <rect x="854" y="350" width="166" height="40" rx="20" fill="#16291E"/>
  <text x="937" y="376" fill="#9BD0A8" font-size="15" text-anchor="middle">clean motion</text>

  <line x1="60" y1="430" x2="1020" y2="430" stroke="#3A3A3A"/>
  <text x="60" y="470" fill="#EDE9E0" font-size="19" font-weight="700">Free spec + copy-paste templates: github.com/minhchee/minimax-h3-prompt-spec</text>
  <text x="60" y="500" fill="#9A958C" font-size="15">CC-BY-4.0 · unofficial community layer</text>
</svg>
